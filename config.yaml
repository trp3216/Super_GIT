# ตั้งค่าโปรเจกต์ตรวจวัดผักตบชวาจาก Sentinel-2
#
# เพิ่มลำน้ำ/คลองใหม่: คัดลอกบล็อกใน `rivers` แล้วแก้ name, label, shapefile
#   shapefile : path ไปยังไฟล์ .shp / .gpkg / .geojson ของลำน้ำ
#   encoding  : (ไม่บังคับ) รหัสภาษาของ .dbf — shapefile ไทยรุ่นเก่ามักเป็น cp874 (TIS-620)
#   query     : (ไม่บังคับ) เลือกเฉพาะบาง feature ตาม attribute เช่น "NAME == 'แม่น้ำท่าจีน'"
#   ถ้า shapefile เป็นเส้น (Line) ต้องเลือกอย่างใดอย่างหนึ่ง:
#     banks_close_m : เส้นตลิ่ง 2 ฝั่ง — เติมผิวน้ำระหว่างตลิ่งที่ห่างกันไม่เกิน 2 เท่าของค่านี้ (เมตร)
#       max_bank_distance_m : (ใช้คู่กับ banks_close_m) ตัดส่วนที่ห่างจากตลิ่งเกินค่านี้ — ไม่ให้นับผืนดินระหว่างร่องน้ำ
#     buffer_m      : เส้นกลางลำน้ำ — ขยายออกข้างละเท่านี้ (เมตร, ครึ่งความกว้าง)
#   shrink_m  : (ไม่บังคับ) หดขอบเข้า ลดพิกเซลปนต้นไม้ริมตลิ่ง (เมตร)
#   clip      : (ไม่บังคับ) ตัดเฉพาะส่วนที่อยู่ในขอบเขต เช่น เขตจังหวัด

rivers:
  - name: tha_chin_chainat
    label: แม่น้ำท่าจีน (ชัยนาท)
    shapefile: แม่น้ำ คลอง/Main_River.shp
    encoding: cp874
    query: "NAME in ['แม่น้ำท่าจีน', 'แม่น้ำสุพรรณ']"  # ช่วงกลางในสุพรรณบุรีชื่อในไฟล์ว่า แม่น้ำสุพรรณ
    banks_close_m: 150
    max_bank_distance_m: 50
    shrink_m: 5
    clip:
      shapefile: data/boundaries/geoBoundaries-THA-ADM1.geojson
      query: "shapeName == 'Chai Nat Province'"

  - name: tha_chin_suphanburi
    label: แม่น้ำท่าจีน (สุพรรณบุรี)
    shapefile: แม่น้ำ คลอง/Main_River.shp
    encoding: cp874
    query: "NAME in ['แม่น้ำท่าจีน', 'แม่น้ำสุพรรณ']"  # ช่วงกลางในสุพรรณบุรีชื่อในไฟล์ว่า แม่น้ำสุพรรณ
    banks_close_m: 150
    max_bank_distance_m: 50
    shrink_m: 5
    clip:
      shapefile: data/boundaries/geoBoundaries-THA-ADM1.geojson
      query: "shapeName == 'Suphan Buri Province'"

  - name: noi
    label: แม่น้ำน้อย
    shapefile: แม่น้ำ คลอง/Main_River.shp
    encoding: cp874
    query: "NAME == 'แม่น้ำน้อย'"
    banks_close_m: 150
    max_bank_distance_m: 50
    shrink_m: 5

  # ตัวอย่างการเพิ่มคลองในอนาคต (คลองหลักอยู่ใน Main_canal.shp / Second_canal.shp)
  # - name: makham_thao
  #   label: คลองมะขามเฒ่า
  #   shapefile: แม่น้ำ คลอง/Main_River.shp
  #   encoding: cp874
  #   query: "NAME == 'คลองมะขามเฒ่า'"
  #   banks_close_m: 100

imagery:
  collection: sentinel-2-l2a
  max_scene_cloud: 60        # % เมฆสูงสุดของทั้งภาพที่จะดึงมาใช้
  min_valid_fraction: 0.5    # ต้องเห็นพื้นที่ลำน้ำ (ไม่ติดเมฆ) อย่างน้อยกี่ส่วน จึงจะนับวันนั้น

classification:
  # ผักตบชวาลอยน้ำ: พืชสีเขียวหนาแน่น (NDVI สูง) ภายในขอบเขตลำน้ำ
  ndvi_min: 0.35
  # น้ำเปิด: NDWI (Green-NIR) สูง
  ndwi_water_min: 0.0
  # นับเฉพาะพิกเซลที่เคยเป็นน้ำอย่างน้อยกี่ % ของเวลา (JRC Global Surface Water 1984–2020)
  # ตัดที่ดินที่ไม่เคยเป็นน้ำออก — ใส่ 0 เพื่อปิด (ปิดไว้: ความละเอียด 30 ม. ตัดลำน้ำแคบทิ้ง และนาข้าวที่เคยท่วมยังผ่าน)
  min_water_occurrence: 0

volume:
  # ค่าประมาณเริ่มต้น ควรปรับเทียบกับข้อมูลภาคสนามในพื้นที่จริง
  mat_thickness_m: 0.5         # ความหนาของแพผักตบ (เหนือ+ใต้น้ำ) เมตร
  wet_biomass_kg_m2: 25.0      # น้ำหนักสดต่อตารางเมตร (กก./ตร.ม.)

output_dir: outputs
